<header class="app-navbar">
  <div class="nav-left">
    <a routerLink="/" class="brand-logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">CoreStore</span>
    </a>

    <nav class="nav-links">
      @if (isAdmin()) {
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          Dashboard
        </a>
      }
      <a routerLink="/products" routerLinkActive="active" class="nav-item">
        Products
      </a>
      <a routerLink="/orders" routerLinkActive="active" class="nav-item">
        {{ isAdmin() ? 'All Orders' : 'My Orders' }}
      </a>
      @if (isAdmin()) {
        <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
          Users
        </a>
      }
    </nav>
  </div>

  <div class="nav-right">
    <!-- Shopping Cart Trigger with Dynamic Badge -->
    <button type="button" class="btn-cart" (click)="openCart()" title="View Cart">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
      </svg>
      @if (cartCount() > 0) {
        <span class="cart-badge">{{ cartCount() }}</span>
      }
    </button>

    <!-- User Profile Dropdown Menu -->
    <div class="user-menu-wrapper">
      <button type="button" class="user-chip-btn" (click)="toggleDropdown()">
        <div class="avatar-pill">{{ getUserInitials() }}</div>
        <div class="user-meta">
          <span class="user-name">{{ getUserInitials() }}</span>
          <span class="user-role-badge" [class.admin]="isAdmin()">{{ currentUser()?.role || 'Customer' }}</span>
        </div>
        <svg class="chevron-icon" [class.rotated]="isDropdownOpen()" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </button>

      @if (isDropdownOpen()) {
        <div class="dropdown-backdrop" (click)="closeDropdown()"></div>
        <div class="dropdown-popover">
          <div class="dropdown-header">
            <div class="font-medium text-dark">{{ getUserInitials() }}</div>
            <div class="text-xs text-muted">{{ currentUser()?.email }}</div>
          </div>
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-item text-danger" (click)="signOut()">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
            </svg>
            Sign Out
          </button>
        </div>
      }
    </div>
  </div>
</header>
