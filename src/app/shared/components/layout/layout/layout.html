<div class="app-container">
  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-brand">
      <span class="brand-logo">⚡</span>
      <span class="brand-name">CommerceHub</span>
    </div>

    <div class="nav-actions">
      <!-- 1. Cart Button with Real-time Count Badge -->
      <button 
        type="button" 
        class="icon-btn cart-btn" 
        (click)="cartService.toggleDrawer()" 
        title="View Shopping Cart">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
        </svg>

        @if (cartService.cartCount() > 0) {
          <span class="cart-nav-badge">{{ cartService.cartCount() }}</span>
        }
      </button>

      <!-- 2. Profile Button & Dropdown Container -->
      <div class="profile-container">
        <button 
          type="button" 
          class="icon-btn profile-btn" 
          (click)="toggleProfile()" 
          title="Account Profile"
          [class.active]="isProfileOpen()">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
        </button>

        @if (isProfileOpen()) {
          <div class="profile-dropdown">
            <div class="dropdown-top-bar">
              <span class="dropdown-title">Account Details</span>
              <button type="button" class="btn-close-popup" (click)="closeProfile()" title="Close">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <div class="dropdown-header">
              <div class="avatar-circle">
                {{ (user()?.email || 'U').charAt(0).toUpperCase() }}
              </div>
              <div class="user-meta">
                <span class="user-name">{{ user()?.email?.split('@')?.[0] || 'User' }}</span>
                <span class="user-email">{{ user()?.email }}</span>
              </div>
            </div>

            <div class="dropdown-divider"></div>

            <div class="dropdown-details">
              <div class="detail-row">
                <span class="detail-label">Role</span>
                <span class="badge-role">{{ user()?.role }}</span>
              </div>
            </div>
          </div>
        }
      </div>

      <!-- 3. Sign Out Button -->
      <button 
        type="button" 
        class="icon-btn logout-btn" 
        (click)="onLogout()" 
        title="Sign Out">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
        </svg>
      </button>
    </div>
  </header>

  <div class="body-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a routerLink="/products" routerLinkActive="active" class="nav-item">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25a2.25 2.25 0 0 1-13.5-18v-2.25Z" />
          </svg>
          <span>Products</span>
        </a>

        <a routerLink="/orders" routerLinkActive="active" class="nav-item">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
          <span>Orders</span>
        </a>

        <!-- Admin Only Menu Item -->
        @if (user()?.role === 'Admin') {
          <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
            </svg>
            <span>Users</span>
          </a>
        }
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Global Slide-Over Cart Drawer -->
  <app-cart-drawer />
</div>
