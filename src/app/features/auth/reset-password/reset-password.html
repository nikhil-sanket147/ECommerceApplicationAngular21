<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Reset Password</h2>
      <p>Enter your new password below</p>
    </div>

    @if (errorMessage(); as error) {
      <div class="alert alert-danger" role="alert">
        {{ error }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="At least 6 characters"
          [class.is-invalid]="newPassword?.invalid && newPassword?.touched"
        />
        @if (newPassword?.invalid && newPassword?.touched) {
          <div class="error-message">
            <span>Password must be at least 6 characters.</span>
          </div>
        }
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirm new password"
          [class.is-invalid]="(confirmPassword?.invalid || form.hasError('passwordMismatch')) && confirmPassword?.touched"
        />
        @if (form.hasError('passwordMismatch') && confirmPassword?.touched) {
          <div class="error-message">
            <span>Passwords do not match.</span>
          </div>
        }
      </div>

      <button type="submit" class="btn-submit" [disabled]="form.invalid || isLoading() || !token()">
        @if (isLoading()) {
          <span>Updating password...</span>
        } @else {
          <span>Reset Password</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p><a routerLink="/login">Back to Login</a></p>
    </div>
  </div>
</div>
